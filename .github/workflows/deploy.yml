name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject API Keys
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          echo "Injecting API keys into all files..."

          # List of files to process
          FILES="index.html pre-task.html post-task.html post-study-survey.html landing.html consent.html admin.html feedback-widget.js"

          for file in $FILES; do
            if [ -f "$file" ]; then
              echo "Processing $file..."
              # Replace OpenAI API key
              awk -v key="$OPENAI_API_KEY" '{gsub(/__OPENAI_API_KEY__/, key); print}' "$file" > "$file.tmp" && mv "$file.tmp" "$file"
              # Replace Firebase API key
              awk -v key="$FIREBASE_API_KEY" '{gsub(/__FIREBASE_API_KEY__/, key); print}' "$file" > "$file.tmp" && mv "$file.tmp" "$file"
              echo "✅ $file processed"
            fi
          done

      - name: Verify injection
        run: |
          echo "Verifying API key placeholders are replaced..."

          FILES="index.html pre-task.html post-task.html post-study-survey.html landing.html consent.html admin.html feedback-widget.js"

          for file in $FILES; do
            if [ -f "$file" ]; then
              if grep -q "__OPENAI_API_KEY__\|__FIREBASE_API_KEY__" "$file"; then
                echo "❌ ERROR: API key placeholder still exists in $file!"
                grep -n "__OPENAI_API_KEY__\|__FIREBASE_API_KEY__" "$file"
                exit 1
              else
                echo "✅ $file - all placeholders replaced"
              fi
            fi
          done

          echo "✅ All API key placeholders replaced successfully"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
