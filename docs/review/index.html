<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study2 preview - Reading Interface</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.9/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- PDF.js library for PDF text extraction -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <!-- Pre-generated sample paper media -->
    <script src="sample-media.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // Reviewer preview: no login, no accounts, nothing is saved to any server.
        // Everything here lives only in this browser tab/session.

        // Cloud function used only to auto-detect the paper's title/author/year for display.
        const CHAT_COMPLETION_URL = 'https://chatcompletion-noiydfdfbq-uc.a.run.app';

        const generateSessionId = () => {
            const suffix = Math.random().toString(36).substring(2, 10);
            return `review_${Date.now()}_${suffix}`;
        };

        function ReviewLanding() {
            const [condition, setCondition] = useState('ebm_cimo');
            const [sampleLoading, setSampleLoading] = useState(false);

            const handleUseSample = async () => {
                setSampleLoading(true);
                try {
                    await window.loadSampleAndGo(condition);
                } catch (e) {
                    console.error('Failed to load sample:', e);
                    setSampleLoading(false);
                }
            };

            const [pdfFile, setPdfFile] = useState(null);
            const [pdfProcessing, setPdfProcessing] = useState(false);
            const [pdfError, setPdfError] = useState('');
            const [pdfProgress, setPdfProgress] = useState('');
            const [currentPaper, setCurrentPaper] = useState('');
            const [isLoading, setIsLoading] = useState(false);

            const openPdfDatabase = () => {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open('CustomPdfDB', 1);
                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => resolve(request.result);
                    request.onupgradeneeded = (event) => {
                        const db = event.target.result;
                        if (!db.objectStoreNames.contains('pdfs')) {
                            db.createObjectStore('pdfs', { keyPath: 'id' });
                        }
                    };
                });
            };

            const savePdfToIndexedDB = async (pdfData) => {
                const idb = await openPdfDatabase();
                return new Promise((resolve, reject) => {
                    const transaction = idb.transaction(['pdfs'], 'readwrite');
                    const store = transaction.objectStore('pdfs');
                    const request = store.put({ id: 'customPdf', ...pdfData });
                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => resolve();
                });
            };

            const extractTextFromPdf = async (file, maxPages = 3) => {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

                let fullText = '';
                const pagesToRead = Math.min(pdf.numPages, maxPages);

                for (let pageNum = 1; pageNum <= pagesToRead; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const textContent = await page.getTextContent();

                    let pageText = '';
                    let lastY = null;

                    for (const item of textContent.items) {
                        if (lastY !== null && Math.abs(item.transform[5] - lastY) > 5) {
                            pageText += '\n';
                        }
                        pageText += item.str;
                        lastY = item.transform[5];
                    }

                    fullText += pageText + '\n\n';
                }

                return { fullText, numPages: pdf.numPages };
            };

            const parseMetadataWithGpt = async (extractedText) => {
                const systemPrompt = `You are an expert at extracting metadata from academic papers. Given the raw text from the first pages of a PDF, extract the following information:

- title: The paper's title
- firstAuthorLastName: The last name of the first author only
- year: Publication year (4 digits)
- venue: Journal name, conference name, or publisher

Rules:
1. For firstAuthorLastName, extract ONLY the last name of the FIRST author
2. If year is not found, return null
3. If venue is not clearly stated, make your best guess or return null
4. Return ONLY valid JSON, no markdown

Return format: {"title": "...", "firstAuthorLastName": "...", "year": 2023, "venue": "..."}`;

                const response = await fetch(CHAT_COMPLETION_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'gpt-4o-mini',
                        messages: [
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: `Extract metadata from this paper:\n\n${extractedText.substring(0, 8000)}` }
                        ],
                        max_tokens: 500,
                        temperature: 0.1
                    })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`GPT API error: ${response.status} - ${errorText}`);
                }

                const data = await response.json();
                let content = data.choices[0].message.content;
                content = content.replace(/^```json\s*/i, '').replace(/```\s*$/i, '').trim();
                return JSON.parse(content);
            };

            const handlePdfSelect = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const fileExtension = file.name.split('.').pop()?.toLowerCase();
                const isPdfExtension = fileExtension === 'pdf';
                const isPdfMimeType = file.type === 'application/pdf';

                if (!isPdfExtension && !isPdfMimeType) {
                    setPdfError(`Invalid file type: "${fileExtension || 'unknown'}". Please upload a PDF file.`);
                    return;
                }
                if (file.size === 0) {
                    setPdfError('The file is empty. Please select a valid PDF file.');
                    return;
                }
                if (file.size > 15 * 1024 * 1024) {
                    const sizeMB = (file.size / (1024 * 1024)).toFixed(1);
                    setPdfError(`File too large (${sizeMB}MB). Maximum size is 15MB.`);
                    return;
                }

                setPdfFile(file);
                setPdfError('');
                setPdfProcessing(true);
                setPdfProgress('Processing PDF...');

                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const uint8Array = new Uint8Array(arrayBuffer);
                    let binary = '';
                    for (let i = 0; i < uint8Array.length; i++) {
                        binary += String.fromCharCode(uint8Array[i]);
                    }
                    const base64 = btoa(binary);

                    setPdfProgress('Extracting text...');
                    const { fullText, numPages } = await extractTextFromPdf(file, 3);

                    setPdfProgress('Parsing metadata...');
                    let metadata = {};
                    try {
                        metadata = await parseMetadataWithGpt(fullText);
                    } catch (metaError) {
                        console.error('Metadata parsing failed:', metaError);
                    }

                    const paperTitle = metadata.title || file.name.replace('.pdf', '');

                    const pdfData = {
                        base64: base64,
                        title: paperTitle,
                        numPages: numPages,
                        metadata: {
                            title: metadata.title || null,
                            firstAuthorLastName: metadata.firstAuthorLastName || null,
                            year: metadata.year || null,
                            venue: metadata.venue || null,
                            numPages: numPages
                        }
                    };

                    await savePdfToIndexedDB(pdfData);

                    sessionStorage.setItem('hasCustomPdf', 'true');
                    sessionStorage.setItem('customPaperTitle', paperTitle);
                    sessionStorage.setItem('paperMetadata', JSON.stringify(pdfData.metadata));

                    setCurrentPaper('custom');
                    setPdfProgress(`✓ Ready! (${numPages} pages)`);
                } catch (error) {
                    console.error('PDF processing error:', error);
                    setPdfError(`Failed to process PDF: ${error.message}`);
                    setPdfFile(null);
                } finally {
                    setPdfProcessing(false);
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!currentPaper) {
                    alert('Please upload a PDF file.');
                    return;
                }

                setIsLoading(true);
                const sessionId = generateSessionId();
                sessionStorage.setItem('currentSessionId', sessionId);
                sessionStorage.setItem('reviewCondition', condition);

                window.location.href = `preparation.html?sessionId=${encodeURIComponent(sessionId)}&mode=review&condition=${condition}&paper=custom`;
            };

            return (
                
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 py-8 px-4">
                    <div className="max-w-2xl mx-auto">
                        <div className="bg-white rounded-xl shadow-2xl p-8">
                            <div className="text-center mb-8">
                                <div className="text-5xl mb-4">📖</div>
                                <h1 className="text-3xl font-bold text-gray-800 mb-2">Study2 Demo</h1>
                                                            <div className="space-y-6 mb-8">
                                <div className="bg-blue-50 border-l-4 border-blue-500 p-4">
                                    <p className="text-sm text-blue-900">
                                        This application is provided for academic peer review purposes. No access information is tracked, and no personally identifiable information is collected &mdash; feel free to explore freely.
                                    </p>
                                </div></div>
                            </div>

                            <form onSubmit={handleSubmit} className="space-y-6">
                                {/* Condition selector */}
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        Choose condition to preview
                                    </label>
                                    <div className="grid grid-cols-2 gap-3">
                                        <button
                                            type="button"
                                            onClick={() => setCondition('control')}
                                            className={`p-4 rounded-lg border-2 text-left transition-colors ${
                                                condition === 'control'
                                                    ? 'border-blue-500 bg-blue-50'
                                                    : 'border-gray-200 hover:border-gray-300'
                                            }`}
                                        >
                                            <div className="font-semibold text-gray-800">Control</div>
                                            <div className="text-xs text-gray-500 mt-1">Chatbot(general) + Video/Podcast/Infographic</div>
                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => setCondition('ebm_cimo')}
                                            className={`p-4 rounded-lg border-2 text-left transition-colors ${
                                                condition === 'ebm_cimo'
                                                    ? 'border-blue-500 bg-blue-50'
                                                    : 'border-gray-200 hover:border-gray-300'
                                            }`}
                                        >
                                            <div className="font-semibold text-gray-800">CIMO</div>
                                            <div className="text-xs text-gray-500 mt-1">Chatbot(CIMO) + Video/Podcast/Infographic</div>
                                        </button>
                                    </div>
                                </div>

                                {/* PDF Upload */}
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        📄 Upload Paper (PDF) *
                                    </label>
                                    <div className="p-4 bg-gray-50 rounded-lg border border-dashed border-gray-300">
                                        <input
                                            type="file"
                                            accept=".pdf"
                                            onChange={handlePdfSelect}
                                            disabled={pdfProcessing}
                                            className="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 disabled:opacity-50"
                                        />
                                        <p className="text-xs text-gray-400 mt-2">Max 15MB</p>

                                        {pdfProcessing && (
                                            <div className="mt-3 flex items-center text-sm text-blue-600">
                                                <svg className="animate-spin h-4 w-4 mr-2" viewBox="0 0 24 24">
                                                    <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" fill="none"></circle>
                                                    <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                                </svg>
                                                {pdfProgress}
                                            </div>
                                        )}

                                        {!pdfProcessing && pdfProgress && pdfProgress.startsWith('✓') && (
                                            <div className="mt-3 text-sm text-green-600">{pdfProgress}</div>
                                        )}

                                        {pdfError && (
                                            <div className="mt-3 text-sm text-red-600">❌ {pdfError}</div>
                                        )}
                                    </div>
                                </div>

                                <div className="pt-2">
                                    <button
                                        type="submit"
                                        disabled={isLoading || pdfProcessing || !currentPaper}
                                        className={`w-full px-6 py-3 rounded-lg font-medium transition-colors flex items-center justify-center text-lg ${
                                            isLoading || pdfProcessing || !currentPaper
                                                ? 'bg-gray-400 cursor-not-allowed'
                                                : 'bg-blue-600 hover:bg-blue-700 text-white'
                                        }`}
                                    >
                                        {pdfProcessing ? 'Processing PDF...' : !currentPaper ? 'Please upload a PDF' : 'Start →'}
                                    </button>
                                </div>

                                <div className="relative flex items-center py-2">
                                    <div className="flex-grow border-t border-gray-200"></div>
                                    <span className="mx-3 text-xs text-gray-400">or</span>
                                    <div className="flex-grow border-t border-gray-200"></div>
                                </div>

                                <button
                                    type="button"
                                    onClick={handleUseSample}
                                    disabled={sampleLoading}
                                    className={`w-full px-6 py-3 rounded-lg font-medium transition-colors border-2 flex items-center justify-center gap-2 ${
                                        sampleLoading
                                            ? 'border-gray-200 text-gray-400 cursor-not-allowed'
                                            : 'border-blue-300 text-blue-700 hover:bg-blue-50'
                                    }`}
                                >
                                    {sampleLoading ? (
                                        <>
                                            <svg className="animate-spin h-4 w-4" viewBox="0 0 24 24">
                                                <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" fill="none"/>
                                                <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"/>
                                            </svg>
                                            Loading sample paper...
                                        </>
                                    ) : '📄 Use sample paper (no upload needed)'}
                                </button>
                            </form>

                            <p className="text-xs text-gray-400 text-center mt-6">
                                This is a standalone preview build for review purposes. No account, no data collection.
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<ReviewLanding />, document.getElementById('root'));
    </script>
</body>
</html>
