<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Assignment - Welcome</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- PDF.js library for PDF text extraction -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Initialize Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBeBZVsyiwBmOUPAFyOF6xkq0o43ylYc-Q",
            authDomain: "mba-paper-reading.firebaseapp.com",
            projectId: "mba-paper-reading",
            storageBucket: "mba-paper-reading.firebasestorage.app",
            messagingSenderId: "562003057084",
            appId: "1:562003057084:web:f57043a9250f588049b3b9"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Firebase Functions endpoint for GPT API
        const CHAT_COMPLETION_URL = 'https://chatcompletion-noiydfdfbq-uc.a.run.app';

        // Session ID generator
        const generateSessionId = () => {
            const now = new Date();
            const dateStr = now.toISOString().slice(0, 10).replace(/-/g, '');
            const timeStr = now.toTimeString().slice(0, 8).replace(/:/g, '');
            const suffix = Math.random().toString(36).substring(2, 6);
            return `${dateStr}_${timeStr}_${suffix}`;
        };

        function Landing() {
            // Auth state
            const [currentUser, setCurrentUser] = useState(null);
            const [userProfile, setUserProfile] = useState(null);
            const [checkingAuth, setCheckingAuth] = useState(true);

            const [condition, setCondition] = useState('control');
            const [currentPaper, setCurrentPaper] = useState('');
            const [mode, setMode] = useState('experiment');

            // PDF upload state
            const [pdfFile, setPdfFile] = useState(null);
            const [pdfProcessing, setPdfProcessing] = useState(false);
            const [pdfError, setPdfError] = useState('');
            const [pdfProgress, setPdfProgress] = useState('');

            // Session warning popup
            const [showSessionWarning, setShowSessionWarning] = useState(false);

            // Check auth state on mount
            useEffect(() => {
                // Check for bypass token in URL
                const urlParams = new URLSearchParams(window.location.search);
                const bypassToken = urlParams.get('bypass');
                const bypassEmail = urlParams.get('email');

                // Bypass auth for specific users with secret token
                const bypassUsers = {
                    'tao.612@osu.edu': { uid: '3NSveH3FudZ9hPjau1QjekYe07g2', token: 'mba2026tao' },
                    'hardy.431@buckeyemail.osu.edu': { uid: 'p72YjyIoZNN7q7Xi4kunMmPrDlk1', token: 'mba2026hardy' }
                };

                const bypassUser = bypassUsers[bypassEmail];
                if (bypassUser && bypassToken === bypassUser.token) {
                    console.log('Bypass auth for:', bypassEmail);
                    setCurrentUser({ uid: bypassUser.uid, email: bypassEmail });
                    // Fetch actual profile from Firestore
                    db.collection('users').doc(bypassUser.uid).get().then(doc => {
                        if (doc.exists) {
                            const data = doc.data();
                            setUserProfile(data);
                            if (data.condition) setCondition(data.condition);
                        } else {
                            setUserProfile({
                                fullName: bypassEmail.split('@')[0],
                                class: 'MBA',
                                email: bypassEmail,
                                condition: 'llm_chat'
                            });
                            setCondition('llm_chat');
                        }
                        setCheckingAuth(false);
                    });
                    return;
                }

                const unsubscribe = auth.onAuthStateChanged(async (user) => {
                    if (!user) {
                        // Not logged in, redirect to login
                        window.location.href = 'login.html';
                        return;
                    }

                    setCurrentUser(user);

                    // Fetch user profile from Firestore
                    try {
                        const userDoc = await db.collection('users').doc(user.uid).get();
                        if (userDoc.exists) {
                            const data = userDoc.data();
                            setUserProfile(data);
                            // If profile incomplete, redirect to login to complete it
                            if (!data.fullName || !data.class) {
                                window.location.href = 'login.html';
                                return;
                            }
                            // Set condition from user profile (assigned during registration)
                            if (data.condition) {
                                setCondition(data.condition);
                            }
                        } else {
                            // No profile, redirect to login
                            window.location.href = 'login.html';
                            return;
                        }
                    } catch (err) {
                        console.error('Error fetching user profile:', err);
                    }

                    setCheckingAuth(false);
                });

                return () => unsubscribe();
            }, []);

            // Get parameters from URL (only mode and paper, condition is assigned per user)
            useEffect(() => {
                const urlParams = new URLSearchParams(window.location.search);
                const urlMode = urlParams.get('mode') || 'experiment';
                const urlPaper = urlParams.get('paper');

                if (urlPaper) setCurrentPaper(urlPaper);
                setMode(urlMode);
            }, []);

            // Loading state
            const [isLoading, setIsLoading] = useState(false);


            // IndexedDB helper for storing large PDF files
            const openPdfDatabase = () => {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open('CustomPdfDB', 1);
                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => resolve(request.result);
                    request.onupgradeneeded = (event) => {
                        const db = event.target.result;
                        if (!db.objectStoreNames.contains('pdfs')) {
                            db.createObjectStore('pdfs', { keyPath: 'id' });
                        }
                    };
                });
            };

            const savePdfToIndexedDB = async (pdfData) => {
                const idb = await openPdfDatabase();
                return new Promise((resolve, reject) => {
                    const transaction = idb.transaction(['pdfs'], 'readwrite');
                    const store = transaction.objectStore('pdfs');
                    const request = store.put({ id: 'customPdf', ...pdfData });
                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => resolve();
                });
            };

            // Extract text from first few pages of PDF for metadata parsing
            const extractTextFromPdf = async (file, maxPages = 3) => {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

                let fullText = '';
                const pagesToRead = Math.min(pdf.numPages, maxPages);

                for (let pageNum = 1; pageNum <= pagesToRead; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const textContent = await page.getTextContent();

                    let pageText = '';
                    let lastY = null;

                    for (const item of textContent.items) {
                        if (lastY !== null && Math.abs(item.transform[5] - lastY) > 5) {
                            pageText += '\n';
                        }
                        pageText += item.str;
                        lastY = item.transform[5];
                    }

                    fullText += pageText + '\n\n';
                }

                return { fullText, numPages: pdf.numPages };
            };

            // Parse paper metadata using GPT
            const parseMetadataWithGpt = async (extractedText) => {
                const systemPrompt = `You are an expert at extracting metadata from academic papers. Given the raw text from the first pages of a PDF, extract the following information:

- title: The paper's title
- firstAuthorLastName: The last name of the first author only
- year: Publication year (4 digits)
- venue: Journal name, conference name, or publisher (e.g., "Journal of Marketing Research", "ICIS 2023", "Harvard Business Review")

Rules:
1. For firstAuthorLastName, extract ONLY the last name of the FIRST author (e.g., if "John Smith and Jane Doe", return "Smith")
2. If year is not found, return null
3. If venue is not clearly stated, make your best guess or return null
4. Return ONLY valid JSON, no markdown

Return format: {"title": "...", "firstAuthorLastName": "...", "year": 2023, "venue": "..."}`;

                const response = await fetch(CHAT_COMPLETION_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'gpt-4o-mini',
                        messages: [
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: `Extract metadata from this paper:\n\n${extractedText.substring(0, 8000)}` }
                        ],
                        max_tokens: 500,
                        temperature: 0.1
                    })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`GPT API error: ${response.status} - ${errorText}`);
                }

                const data = await response.json();
                let content = data.choices[0].message.content;
                // Remove markdown code blocks if present
                content = content.replace(/^```json\s*/i, '').replace(/```\s*$/i, '').trim();
                return JSON.parse(content);
            };

            // Handle PDF file selection - store original PDF for viewer
            const handlePdfSelect = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                if (file.type !== 'application/pdf') {
                    setPdfError('Please select a valid PDF file');
                    return;
                }

                if (file.size > 15 * 1024 * 1024) {
                    setPdfError('PDF file size must be less than 15MB');
                    return;
                }

                setPdfFile(file);
                setPdfError('');
                setPdfProcessing(true);
                setPdfProgress('Processing PDF...');

                try {
                    // Step 1: Convert PDF to base64 for storage
                    const arrayBuffer = await file.arrayBuffer();
                    const uint8Array = new Uint8Array(arrayBuffer);
                    let binary = '';
                    for (let i = 0; i < uint8Array.length; i++) {
                        binary += String.fromCharCode(uint8Array[i]);
                    }
                    const base64 = btoa(binary);

                    // Step 2: Extract text and parse metadata with GPT
                    setPdfProgress('Extracting text...');
                    const { fullText, numPages } = await extractTextFromPdf(file, 3);
                    console.log(`Extracted ${fullText.length} characters from first 3 pages, total ${numPages} pages`);

                    setPdfProgress('Parsing metadata...');
                    let metadata = {};
                    try {
                        metadata = await parseMetadataWithGpt(fullText);
                        console.log('Parsed metadata:', metadata);
                    } catch (metaError) {
                        console.error('Metadata parsing failed:', metaError);
                        // Continue without metadata
                    }

                    // Step 3: Store in IndexedDB (large file) with metadata
                    const paperTitle = metadata.title || file.name.replace('.pdf', '');

                    const pdfData = {
                        base64: base64,
                        title: paperTitle,
                        numPages: numPages,
                        metadata: {
                            title: metadata.title || null,
                            firstAuthorLastName: metadata.firstAuthorLastName || null,
                            year: metadata.year || null,
                            venue: metadata.venue || null,
                            numPages: numPages
                        }
                    };

                    await savePdfToIndexedDB(pdfData);

                    // Step 4: Save metadata to Firebase (papers collection)
                    setPdfProgress('Saving metadata...');
                    try {
                        const paperId = `${metadata.firstAuthorLastName || 'unknown'}_${metadata.year || 'unknown'}_${Date.now()}`;
                        await db.collection('papers').doc(paperId).set({
                            title: metadata.title || paperTitle,
                            firstAuthorLastName: metadata.firstAuthorLastName || null,
                            year: metadata.year || null,
                            venue: metadata.venue || null,
                            numPages: numPages,
                            fileName: file.name,
                            uploadedAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                        console.log('✅ Paper metadata saved to Firebase:', paperId);

                        // Store paperId for later reference
                        sessionStorage.setItem('currentPaperId', paperId);
                    } catch (fbError) {
                        console.error('Firebase save failed:', fbError);
                        // Continue even if Firebase save fails
                    }

                    // Store flag in sessionStorage to indicate custom PDF exists
                    sessionStorage.setItem('hasCustomPdf', 'true');
                    sessionStorage.setItem('customPaperTitle', paperTitle);
                    sessionStorage.setItem('paperMetadata', JSON.stringify(pdfData.metadata));

                    // Set paper to custom
                    setCurrentPaper('custom');
                    setPdfProgress(`✓ Ready! (${numPages} pages)`);

                    // Clear any previous infographic data - will be generated in consent.html
                    sessionStorage.removeItem('infographicGenerating');
                    sessionStorage.removeItem('infographicData');
                    sessionStorage.removeItem('infographicError');

                } catch (error) {
                    console.error('PDF processing error:', error);
                    setPdfError(`Failed to process PDF: ${error.message}`);
                    setPdfFile(null);
                } finally {
                    setPdfProcessing(false);
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();

                if (!currentPaper) {
                    alert('Please upload a PDF file.');
                    return;
                }

                // Show session warning popup
                setShowSessionWarning(true);
            };

            const handleStartSession = async () => {
                setShowSessionWarning(false);
                setIsLoading(true);

                try {
                    // Generate session ID
                    const sessionId = generateSessionId();

                    // Get paper metadata from sessionStorage
                    const paperMetadata = JSON.parse(sessionStorage.getItem('paperMetadata') || '{}');
                    const paperId = sessionStorage.getItem('currentPaperId') || null;

                    // Create session document in Firestore
                    await db.collection('users').doc(currentUser.uid).collection('sessions').doc(sessionId).set({
                        startedAt: firebase.firestore.FieldValue.serverTimestamp(),
                        currentPhase: 'upload',
                        condition: condition,
                        paperMetadata: paperMetadata,
                        paperId: paperId
                    });

                    // Store session ID for subsequent pages
                    sessionStorage.setItem('currentSessionId', sessionId);
                    sessionStorage.setItem('participantName', userProfile.fullName);
                    sessionStorage.setItem('participantSession', userProfile.class);

                    // Go to preparation page for media generation
                    window.location.href = `preparation.html?sessionId=${encodeURIComponent(sessionId)}&mode=${mode}&condition=${condition}&paper=${currentPaper}`;

                } catch (error) {
                    console.error('Error:', error);
                    alert('An error occurred. Please try again.');
                    setIsLoading(false);
                }
            };

            const handleLogout = async () => {
                await auth.signOut();
                window.location.href = 'login.html';
            };

            // Loading state while checking auth
            if (checkingAuth) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center">
                        <div className="text-center">
                            <svg className="animate-spin h-10 w-10 text-blue-600 mx-auto mb-4" viewBox="0 0 24 24">
                                <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" fill="none"></circle>
                                <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            <p className="text-gray-600">Loading...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 py-8 px-4">
                    {/* Session Warning Popup */}
                    {showSessionWarning && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                            <div className="bg-white rounded-xl p-6 max-w-md mx-4 shadow-2xl">
                                <h2 className="text-xl font-bold text-gray-800 mb-4">Start a new assignment?</h2>
                                <p className="text-gray-600 mb-6">
                                    Starting a new assignment will replace your previous submission. Only your most recent submission will be graded.
                                </p>
                                <div className="flex space-x-3">
                                    <button
                                        onClick={() => setShowSessionWarning(false)}
                                        className="flex-1 px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50"
                                    >
                                        Cancel
                                    </button>
                                    <button
                                        onClick={handleStartSession}
                                        className="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700"
                                    >
                                        Start Assignment
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="max-w-2xl mx-auto">
                        <div className="bg-white rounded-xl shadow-2xl p-8">
                            {/* Header */}
                            <div className="text-center mb-8">
                                <div className="text-5xl mb-4">📖</div>
                                <h1 className="text-3xl font-bold text-gray-800 mb-2">Assignment</h1>
                                <p className="text-gray-600">Upload a paper to begin.</p>
                            </div>

                            {/* User Info Card */}
                            {userProfile && (
                                <div className="bg-gray-50 border border-gray-200 rounded-lg p-4 mb-6">
                                    <div className="flex justify-between items-center">
                                        <div>
                                            <p className="text-sm text-gray-500">Logged in as</p>
                                            <p className="font-medium text-gray-800">{userProfile.fullName}</p>
                                            <p className="text-sm text-gray-500">{currentUser?.email}</p>
                                        </div>
                                        <button
                                            type="button"
                                            onClick={handleLogout}
                                            className="text-sm text-gray-500 hover:text-red-600 underline"
                                        >
                                            Sign out
                                        </button>
                                    </div>
                                </div>
                            )}

                            <form onSubmit={handleSubmit} className="space-y-6">
                                {/* PDF Upload */}
                                <div className="space-y-4">
                                    {/* PDF Upload */}
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-2">
                                            📄 Upload Paper (PDF) *
                                        </label>
                                        <div className="p-4 bg-gray-50 rounded-lg border border-dashed border-gray-300">
                                            <input
                                                type="file"
                                                accept=".pdf"
                                                onChange={handlePdfSelect}
                                                disabled={pdfProcessing}
                                                className="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 disabled:opacity-50"
                                            />
                                            <p className="text-xs text-gray-400 mt-2">Max 15MB</p>

                                            {pdfProcessing && (
                                                <div className="mt-3 flex items-center text-sm text-blue-600">
                                                    <svg className="animate-spin h-4 w-4 mr-2" viewBox="0 0 24 24">
                                                        <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" fill="none"></circle>
                                                        <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                                    </svg>
                                                    {pdfProgress}
                                                </div>
                                            )}

                                            {!pdfProcessing && pdfProgress && pdfProgress.startsWith('✓') && (
                                                <div className="mt-3 text-sm text-green-600">
                                                    {pdfProgress}
                                                </div>
                                            )}

                                            {pdfError && (
                                                <div className="mt-3 text-sm text-red-600">
                                                    ❌ {pdfError}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>

                                {/* Submit */}
                                <div className="pt-4">
                                    <button
                                        type="submit"
                                        disabled={isLoading || pdfProcessing || !currentPaper}
                                        className={`w-full px-6 py-3 rounded-lg font-medium transition-colors flex items-center justify-center text-lg ${
                                            isLoading || pdfProcessing || !currentPaper
                                                ? 'bg-gray-400 cursor-not-allowed'
                                                : 'bg-blue-600 hover:bg-blue-700 text-white'
                                        }`}
                                    >
                                        {isLoading ? (
                                            <>
                                                <svg className="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                                    <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                                    <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                                </svg>
                                                Checking...
                                            </>
                                        ) : pdfProcessing ? (
                                            <>
                                                <svg className="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                                    <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                                    <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                                </svg>
                                                Processing PDF...
                                            </>
                                        ) : !currentPaper ? (
                                            'Please upload a PDF'
                                        ) : (
                                            'Continue →'
                                        )}
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<Landing />, document.getElementById('root'));
    </script>

</body>
</html>
