<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat History Viewer - MBA Reading Experiment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .chat-bubble-user {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .chat-bubble-ai {
            background: #f3f4f6;
        }
        .participant-item:hover {
            background-color: #f3f4f6;
        }
        .participant-item.active {
            background-color: #e0e7ff;
            border-left: 3px solid #6366f1;
        }
        .markdown-content h1, .markdown-content h2, .markdown-content h3 {
            font-weight: bold;
            margin-top: 1em;
            margin-bottom: 0.5em;
        }
        .markdown-content h1 { font-size: 1.5em; }
        .markdown-content h2 { font-size: 1.25em; }
        .markdown-content h3 { font-size: 1.1em; }
        .markdown-content p { margin-bottom: 0.75em; }
        .markdown-content ul, .markdown-content ol {
            margin-left: 1.5em;
            margin-bottom: 0.75em;
        }
        .markdown-content li { margin-bottom: 0.25em; }
        .markdown-content code {
            background-color: #e5e7eb;
            padding: 0.125em 0.25em;
            border-radius: 0.25em;
            font-size: 0.9em;
        }
        .markdown-content pre {
            background-color: #1f2937;
            color: #f9fafb;
            padding: 1em;
            border-radius: 0.5em;
            overflow-x: auto;
            margin-bottom: 0.75em;
        }
        .markdown-content pre code {
            background-color: transparent;
            padding: 0;
        }
        .markdown-content strong { font-weight: 600; }
        .markdown-content em { font-style: italic; }
        .markdown-content blockquote {
            border-left: 3px solid #d1d5db;
            padding-left: 1em;
            color: #6b7280;
            margin-bottom: 0.75em;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <div class="w-80 bg-white border-r border-gray-200 flex flex-col">
            <div class="p-4 border-b border-gray-200">
                <h1 class="text-xl font-bold text-gray-800">Chat History</h1>
                <p class="text-sm text-gray-500 mt-1">MBA Reading Experiment</p>
            </div>

            <!-- Filter -->
            <div class="p-4 border-b border-gray-200">
                <label class="block text-sm font-medium text-gray-700 mb-2">Condition</label>
                <select id="conditionFilter" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="all">All Conditions</option>
                    <option value="control">Control</option>
                    <option value="ebm_cimo">EBM-CIMO</option>
                </select>
            </div>

            <!-- Stats -->
            <div class="p-4 border-b border-gray-200 bg-gray-50">
                <div class="grid grid-cols-2 gap-2 text-sm">
                    <div>
                        <span class="text-gray-500">Participants:</span>
                        <span id="participantCount" class="font-semibold text-gray-800">0</span>
                    </div>
                    <div>
                        <span class="text-gray-500">Messages:</span>
                        <span id="messageCount" class="font-semibold text-gray-800">0</span>
                    </div>
                </div>
            </div>

            <!-- Participant List -->
            <div class="flex-1 overflow-y-auto" id="participantList">
                <div class="p-4 text-center text-gray-500">
                    Loading...
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col bg-white">
            <!-- Header -->
            <div class="p-4 border-b border-gray-200 bg-gray-50" id="chatHeader">
                <div class="text-gray-500 text-center">Select a participant to view their chat history</div>
            </div>

            <!-- Chat Messages -->
            <div class="flex-1 overflow-y-auto p-4" id="chatMessages">
                <div class="text-gray-400 text-center mt-20">
                    <svg class="w-16 h-16 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                    </svg>
                    <p>No conversation selected</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let chatData = [];
        let participants = [];
        let currentParticipant = null;

        // Simple markdown parser
        function parseMarkdown(text) {
            if (!text) return '';

            // Escape HTML
            let html = text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');

            // Code blocks
            html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>');

            // Inline code
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

            // Bold
            html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

            // Italic
            html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');

            // Headers
            html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
            html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
            html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

            // Blockquotes
            html = html.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');

            // Unordered lists
            html = html.replace(/^[\-\*] (.+)$/gm, '<li>$1</li>');
            html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');

            // Ordered lists
            html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');

            // Line breaks
            html = html.replace(/\n\n/g, '</p><p>');
            html = html.replace(/\n/g, '<br>');

            // Wrap in paragraph
            if (!html.startsWith('<')) {
                html = '<p>' + html + '</p>';
            }

            return html;
        }

        function formatTime(isoString) {
            if (!isoString) return '';
            try {
                const date = new Date(isoString);
                return date.toLocaleString('ko-KR', {
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            } catch {
                return isoString;
            }
        }

        function loadData() {
            // Try to load from URL parameter first
            const urlParams = new URLSearchParams(window.location.search);
            const dataUrl = urlParams.get('data');

            const jsonPath = dataUrl || 'data/chat-viewer-data.json';

            fetch(jsonPath)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Data file not found');
                    }
                    return response.json();
                })
                .then(data => {
                    chatData = data.chats || [];
                    processParticipants();
                    renderParticipantList();
                })
                .catch(error => {
                    console.error('Error loading data:', error);
                    document.getElementById('participantList').innerHTML = `
                        <div class="p-4 text-center">
                            <p class="text-red-500 mb-2">Failed to load chat data</p>
                            <p class="text-sm text-gray-500">Make sure to run the analysis pipeline first.</p>
                            <p class="text-xs text-gray-400 mt-2">Looking for: ${jsonPath}</p>
                        </div>
                    `;
                });
        }

        function processParticipants() {
            const participantMap = new Map();

            chatData.forEach(chat => {
                const key = `${chat.userId}_${chat.sessionId}`;
                if (!participantMap.has(key)) {
                    participantMap.set(key, {
                        id: key,
                        sessionId: chat.sessionId,
                        userId: chat.userId,
                        email: chat.userEmail,
                        condition: chat.condition,
                        messages: []
                    });
                }
                participantMap.get(key).messages.push(chat);
            });

            participants = Array.from(participantMap.values())
                .sort((a, b) => b.messages.length - a.messages.length);
        }

        function renderParticipantList() {
            const filter = document.getElementById('conditionFilter').value;
            const filtered = filter === 'all'
                ? participants
                : participants.filter(p => p.condition === filter);

            const totalMessages = filtered.reduce((sum, p) => sum + p.messages.length, 0);
            document.getElementById('participantCount').textContent = filtered.length;
            document.getElementById('messageCount').textContent = totalMessages;

            if (filtered.length === 0) {
                document.getElementById('participantList').innerHTML = `
                    <div class="p-4 text-center text-gray-500">
                        No participants found
                    </div>
                `;
                return;
            }

            const html = filtered.map(p => `
                <div class="participant-item p-3 border-b border-gray-100 cursor-pointer ${currentParticipant?.id === p.id ? 'active' : ''}"
                     onclick="selectParticipant('${p.id}')">
                    <div class="flex justify-between items-start">
                        <div class="flex-1 min-w-0">
                            <div class="font-medium text-gray-800 truncate">${p.email || p.userId}</div>
                            <div class="text-xs text-gray-500 mt-1">
                                <span class="inline-block px-2 py-0.5 rounded-full ${p.condition === 'ebm_cimo' ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700'}">
                                    ${p.condition === 'ebm_cimo' ? 'EBM-CIMO' : 'Control'}
                                </span>
                            </div>
                        </div>
                        <div class="text-sm text-gray-500 ml-2">
                            ${p.messages.length} msgs
                        </div>
                    </div>
                </div>
            `).join('');

            document.getElementById('participantList').innerHTML = html;
        }

        function selectParticipant(id) {
            currentParticipant = participants.find(p => p.id === id);

            // Update sidebar selection
            document.querySelectorAll('.participant-item').forEach(el => {
                el.classList.remove('active');
            });
            event.currentTarget.classList.add('active');

            // Update header
            document.getElementById('chatHeader').innerHTML = `
                <div class="flex items-center justify-between">
                    <div>
                        <h2 class="font-semibold text-gray-800">${currentParticipant.email || currentParticipant.userId}</h2>
                        <p class="text-sm text-gray-500">
                            <span class="inline-block px-2 py-0.5 rounded-full text-xs ${currentParticipant.condition === 'ebm_cimo' ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700'}">
                                ${currentParticipant.condition === 'ebm_cimo' ? 'EBM-CIMO' : 'Control'}
                            </span>
                            <span class="ml-2">${currentParticipant.messages.length} messages</span>
                        </p>
                    </div>
                </div>
            `;

            // Render messages
            renderMessages();
        }

        function renderMessages() {
            if (!currentParticipant) return;

            const messages = currentParticipant.messages.sort((a, b) => a.messageIndex - b.messageIndex);

            const html = messages.map(msg => `
                <div class="mb-6">
                    <!-- User Question -->
                    <div class="flex justify-end mb-2">
                        <div class="max-w-[80%]">
                            <div class="chat-bubble-user text-white px-4 py-3 rounded-2xl rounded-tr-md shadow-sm">
                                <p class="whitespace-pre-wrap">${msg.question || '(empty)'}</p>
                            </div>
                            <div class="text-xs text-gray-400 text-right mt-1">${formatTime(msg.questionTime)}</div>
                        </div>
                    </div>

                    <!-- AI Response -->
                    <div class="flex justify-start">
                        <div class="max-w-[80%]">
                            <div class="flex items-start">
                                <div class="w-8 h-8 rounded-full bg-gradient-to-br from-green-400 to-blue-500 flex items-center justify-center text-white text-sm font-bold mr-2 flex-shrink-0">
                                    AI
                                </div>
                                <div class="chat-bubble-ai text-gray-800 px-4 py-3 rounded-2xl rounded-tl-md shadow-sm markdown-content">
                                    ${parseMarkdown(msg.answer) || '<em class="text-gray-400">(no response)</em>'}
                                </div>
                            </div>
                            <div class="text-xs text-gray-400 ml-10 mt-1">
                                ${formatTime(msg.answerTime)}
                                ${msg.responseTime ? `<span class="ml-2">(${(msg.responseTime / 1000).toFixed(1)}s)</span>` : ''}
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');

            document.getElementById('chatMessages').innerHTML = html || `
                <div class="text-gray-400 text-center mt-20">No messages</div>
            `;
        }

        // Event listeners
        document.getElementById('conditionFilter').addEventListener('change', renderParticipantList);

        // Initialize
        loadData();
    </script>
</body>
</html>
