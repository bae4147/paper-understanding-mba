<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Experiment - Welcome</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- PDF.js library for PDF text extraction -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Initialize Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBeBZVsyiwBmOUPAFyOF6xkq0o43ylYc-Q",
            authDomain: "mba-paper-reading.firebaseapp.com",
            projectId: "mba-paper-reading",
            storageBucket: "mba-paper-reading.firebasestorage.app",
            messagingSenderId: "562003057084",
            appId: "1:562003057084:web:f57043a9250f588049b3b9"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Firebase Functions endpoint
        const CHAT_COMPLETION_URL = 'https://chatcompletion-noiydfdfbq-uc.a.run.app';

        function Landing() {
            const [participantName, setParticipantName] = useState('');
            const [session, setSession] = useState('');
            const [condition, setCondition] = useState('control');
            const [currentPaper, setCurrentPaper] = useState('');
            const [mode, setMode] = useState('experiment');

            // PDF upload state
            const [pdfFile, setPdfFile] = useState(null);
            const [pdfProcessing, setPdfProcessing] = useState(false);
            const [pdfError, setPdfError] = useState('');
            const [pdfProgress, setPdfProgress] = useState('');

            // Get parameters from URL
            useEffect(() => {
                const urlParams = new URLSearchParams(window.location.search);
                const urlMode = urlParams.get('mode') || 'experiment';
                const urlCondition = urlParams.get('condition');
                const urlPaper = urlParams.get('paper');

                if (urlCondition) setCondition(urlCondition);
                if (urlPaper) setCurrentPaper(urlPaper);
                setMode(urlMode);
            }, []);

            // Loading state
            const [isLoading, setIsLoading] = useState(false);


            // IndexedDB helper for storing large PDF files
            const openPdfDatabase = () => {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open('CustomPdfDB', 1);
                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => resolve(request.result);
                    request.onupgradeneeded = (event) => {
                        const db = event.target.result;
                        if (!db.objectStoreNames.contains('pdfs')) {
                            db.createObjectStore('pdfs', { keyPath: 'id' });
                        }
                    };
                });
            };

            const savePdfToIndexedDB = async (pdfData) => {
                const db = await openPdfDatabase();
                return new Promise((resolve, reject) => {
                    const transaction = db.transaction(['pdfs'], 'readwrite');
                    const store = transaction.objectStore('pdfs');
                    const request = store.put({ id: 'customPdf', ...pdfData });
                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => resolve();
                });
            };

            // PDF text extraction using PDF.js
            const extractTextFromPdf = async (file) => {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

                let fullText = '';

                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    setPdfProgress(`Extracting page ${pageNum}/${pdf.numPages}...`);
                    const page = await pdf.getPage(pageNum);
                    const textContent = await page.getTextContent();

                    let pageText = '';
                    let lastY = null;

                    for (const item of textContent.items) {
                        if (lastY !== null && Math.abs(item.transform[5] - lastY) > 5) {
                            pageText += '\n';
                        }
                        pageText += item.str;
                        lastY = item.transform[5];
                    }

                    fullText += pageText + '\n\n';
                }

                return { fullText, numPages: pdf.numPages };
            };

            // Parse sections using GPT - returns section names with page ranges
            const parseSectionsWithGpt = async (extractedText, numPages) => {
                setPdfProgress('Analyzing paper structure ...');

                const systemPrompt = `You are an expert at parsing academic papers. Given the raw text extracted from a PDF, identify the major sections.

For each section, output a JSON object with:
- "sectionName": The section heading (e.g., "Abstract", "1. Introduction", "2. Methods", "3. Results", "4. Discussion", "5. Conclusion", "References")
- "startPage": Estimated starting page number (1-indexed)
- "endPage": Estimated ending page number (1-indexed)
- "summary": A brief 1-2 sentence summary of this section's content

Rules:
1. Keep the original section numbering if present (e.g., "2.1 Participants")
2. Include all major sections and important subsections
3. Page estimates should be based on where content appears in the extracted text
4. The total PDF has ${numPages} pages
5. Do NOT include References content in summary, just mark the section

Return format: {"sections": [{"sectionName": "...", "startPage": 1, "endPage": 2, "summary": "..."}]}`;

                const response = await fetch(CHAT_COMPLETION_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'gpt-4o',
                        messages: [
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: `Parse this ${numPages}-page academic paper into sections:\n\n${extractedText.substring(0, 60000)}` }
                        ],
                        max_tokens: 4000,
                        temperature: 0.3
                    })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`GPT API error: ${response.status} - ${errorText}`);
                }

                const data = await response.json();
                let content = data.choices[0].message.content;
                // Remove markdown code blocks if present
                content = content.replace(/^```json\s*/i, '').replace(/```\s*$/i, '').trim();
                const result = JSON.parse(content);
                return result.sections || [];
            };

            // Convert sections to HTML with data-section attributes
            const sectionsToHtml = (sections, paperTitle) => {
                const escapeHtml = (text) => {
                    const div = document.createElement('div');
                    div.textContent = text;
                    return div.innerHTML;
                };

                let html = `<h1 class="text-3xl font-bold mb-6">${escapeHtml(paperTitle)}</h1>`;

                for (const section of sections) {
                    // Skip References section content (just keep heading)
                    const isReferences = section.sectionName.toLowerCase().includes('reference');

                    html += `<h2 class="text-2xl font-bold mb-4 mt-8" data-section="${escapeHtml(section.sectionName)}">${escapeHtml(section.sectionName)}</h2>`;

                    if (!isReferences) {
                        const paragraphs = section.content.split(/\n\n+/);
                        for (const para of paragraphs) {
                            if (para.trim()) {
                                html += `<p class="mb-4 text-justify leading-relaxed">${escapeHtml(para.trim())}</p>`;
                            }
                        }
                    } else {
                        html += `<p class="mb-4 text-gray-500 italic">References section omitted for brevity.</p>`;
                    }
                }

                return html;
            };

            // Handle PDF file selection - store original PDF for viewer
            const handlePdfSelect = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                if (file.type !== 'application/pdf') {
                    setPdfError('Please select a valid PDF file');
                    return;
                }

                if (file.size > 15 * 1024 * 1024) {
                    setPdfError('PDF file size must be less than 15MB');
                    return;
                }

                setPdfFile(file);
                setPdfError('');
                setPdfProcessing(true);
                setPdfProgress('Processing PDF...');

                try {
                    // Step 1: Convert PDF to base64 for storage
                    const arrayBuffer = await file.arrayBuffer();
                    const uint8Array = new Uint8Array(arrayBuffer);
                    let binary = '';
                    for (let i = 0; i < uint8Array.length; i++) {
                        binary += String.fromCharCode(uint8Array[i]);
                    }
                    const base64 = btoa(binary);

                    // Step 2: Extract text for section detection
                    setPdfProgress('Extracting text for section detection...');
                    const { fullText, numPages } = await extractTextFromPdf(file);
                    console.log(`Extracted ${fullText.length} characters from ${numPages} pages`);

                    // Step 3: Parse sections with GPT (get section names and page ranges)
                    setPdfProgress('Detecting sections...');
                    const sections = await parseSectionsWithGpt(fullText, numPages);
                    console.log(`Identified ${sections.length} sections:`, sections.map(s => s.sectionName));

                    // Step 4: Store in IndexedDB (large file) and sessionStorage (metadata)
                    const paperTitle = file.name.replace('.pdf', '');

                    // Store large PDF data in IndexedDB
                    await savePdfToIndexedDB({
                        base64: base64,
                        title: paperTitle,
                        sections: sections,
                        numPages: numPages
                    });

                    // Store flag in sessionStorage to indicate custom PDF exists
                    sessionStorage.setItem('hasCustomPdf', 'true');
                    sessionStorage.setItem('customPaperTitle', paperTitle);

                    // Set paper to custom
                    setCurrentPaper('custom');
                    setPdfProgress(`✓ Ready! ${numPages} pages, ${sections.length} sections`);

                    // Clear any previous infographic data - will be generated in consent.html
                    sessionStorage.removeItem('infographicGenerating');
                    sessionStorage.removeItem('infographicData');
                    sessionStorage.removeItem('infographicError');

                } catch (error) {
                    console.error('PDF processing error:', error);
                    setPdfError(`Failed to process PDF: ${error.message}`);
                    setPdfFile(null);
                } finally {
                    setPdfProcessing(false);
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();

                if (!participantName.trim()) {
                    alert('Please enter your name.');
                    return;
                }

                if (!session) {
                    alert('Please select your session.');
                    return;
                }

                if (!currentPaper) {
                    alert('Please upload a PDF file.');
                    return;
                }

                setIsLoading(true);

                try {
                    // Generate a unique participant ID from name + timestamp
                    const participantId = `${participantName.trim().replace(/\s+/g, '_')}_${Date.now()}`;

                    // Store participant info in sessionStorage
                    sessionStorage.setItem('participantName', participantName.trim());
                    sessionStorage.setItem('participantSession', session);

                    // Go directly to index.html (skip consent)
                    window.location.href = `index.html?participantId=${encodeURIComponent(participantId)}&mode=${mode}&condition=${condition}&paper=${currentPaper}`;

                } catch (error) {
                    console.error('Error:', error);
                    alert('An error occurred. Please try again.');
                    setIsLoading(false);
                }
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 py-8 px-4">
                    <div className="max-w-2xl mx-auto">
                        <div className="bg-white rounded-xl shadow-2xl p-8">
                            {/* Header */}
                            <div className="text-center mb-8">
                                <div className="text-5xl mb-4">📖</div>
                                <h1 className="text-3xl font-bold text-gray-800 mb-2">Welcome to the Reading Experiment</h1>
                                <p className="text-gray-600">Please enter your information to begin.</p>
                            </div>

                            <form onSubmit={handleSubmit} className="space-y-6">
                                {/* Name */}
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        Name *
                                    </label>
                                    <input
                                        type="text"
                                        value={participantName}
                                        onChange={(e) => setParticipantName(e.target.value)}
                                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-lg"
                                        placeholder="Enter your name"
                                        required
                                    />
                                </div>

                                {/* Session Selection */}
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        Which session are you from? *
                                    </label>
                                    <div className="space-y-2">
                                        {[
                                            { value: 'honda', label: 'Honda Program' },
                                            { value: 'mba6202_tue', label: 'MBA 6202 (Tuesdays)' },
                                            { value: 'mba6202_wed', label: 'MBA 6202 (Wednesdays)' },
                                            { value: 'mba6202_sat', label: 'MBA 6202 (Saturdays)' },
                                            { value: 'busoba7399', label: 'BUSOBA 7399 - Leadership in SCM (36109)' },
                                            { value: 'busoba7397', label: 'BUSOBA 7397 - MSCM Mid-Program (34668)' }
                                        ].map(option => (
                                            <label key={option.value} className="flex items-center space-x-3 p-3 border border-gray-200 rounded-lg hover:bg-gray-50 cursor-pointer">
                                                <input
                                                    type="radio"
                                                    name="session"
                                                    value={option.value}
                                                    checked={session === option.value}
                                                    onChange={(e) => setSession(e.target.value)}
                                                    className="w-4 h-4"
                                                />
                                                <span className="text-sm text-gray-700">{option.label}</span>
                                            </label>
                                        ))}
                                    </div>
                                </div>

                                {/* Experiment Options */}
                                <div className="space-y-4 border-t pt-6">
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-2">
                                            Condition
                                        </label>
                                        <div className="space-y-2">
                                            {[
                                                { value: 'control', label: 'Control (Direct Answer LLM)' },
                                                { value: 'ebm', label: 'EBM (Evidence-Based Reasoning Coach)' },
                                                { value: 'ebm_coach', label: 'EBM Coach (Answer First, Then Guide)' }
                                            ].map(option => (
                                                <label key={option.value} className="flex items-center space-x-3 p-3 border border-gray-200 rounded-lg hover:bg-gray-50 cursor-pointer">
                                                    <input
                                                        type="radio"
                                                        name="condition"
                                                        value={option.value}
                                                        checked={condition === option.value}
                                                        onChange={(e) => setCondition(e.target.value)}
                                                        className="w-4 h-4"
                                                    />
                                                    <span className="text-sm text-gray-700">{option.label}</span>
                                                </label>
                                            ))}
                                        </div>
                                    </div>

                                    {/* PDF Upload */}
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-2">
                                            📄 Upload Paper (PDF) *
                                        </label>
                                        <div className="p-4 bg-gray-50 rounded-lg border border-dashed border-gray-300">
                                            <input
                                                type="file"
                                                accept=".pdf"
                                                onChange={handlePdfSelect}
                                                disabled={pdfProcessing}
                                                className="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 disabled:opacity-50"
                                            />
                                            <p className="text-xs text-gray-400 mt-2">Max 15MB. AI will parse sections automatically.</p>

                                            {pdfProcessing && (
                                                <div className="mt-3 flex items-center text-sm text-blue-600">
                                                    <svg className="animate-spin h-4 w-4 mr-2" viewBox="0 0 24 24">
                                                        <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" fill="none"></circle>
                                                        <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                                    </svg>
                                                    {pdfProgress}
                                                </div>
                                            )}

                                            {!pdfProcessing && pdfProgress && pdfProgress.startsWith('✓') && (
                                                <div className="mt-3 text-sm text-green-600">
                                                    {pdfProgress}
                                                </div>
                                            )}

                                            {pdfError && (
                                                <div className="mt-3 text-sm text-red-600">
                                                    ❌ {pdfError}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>

                                {/* Submit */}
                                <div className="pt-4">
                                    <button
                                        type="submit"
                                        disabled={isLoading || pdfProcessing || !currentPaper}
                                        className={`w-full px-6 py-3 rounded-lg font-medium transition-colors flex items-center justify-center text-lg ${
                                            isLoading || pdfProcessing || !currentPaper
                                                ? 'bg-gray-400 cursor-not-allowed'
                                                : 'bg-blue-600 hover:bg-blue-700 text-white'
                                        }`}
                                    >
                                        {isLoading ? (
                                            <>
                                                <svg className="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                                    <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                                    <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                                </svg>
                                                Checking...
                                            </>
                                        ) : pdfProcessing ? (
                                            <>
                                                <svg className="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                                    <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                                    <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                                </svg>
                                                Processing PDF...
                                            </>
                                        ) : !currentPaper ? (
                                            'Please upload a PDF'
                                        ) : (
                                            'Continue →'
                                        )}
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<Landing />, document.getElementById('root'));
    </script>

</body>
</html>
