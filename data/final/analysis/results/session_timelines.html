<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Session Timelines</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, sans-serif; font-size: 12px; background: #f5f5f5; color: #222; }
  #header { position: sticky; top: 0; z-index: 100; background: #1e2433; color: #fff; padding: 10px 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  #header h1 { font-size: 14px; font-weight: 600; white-space: nowrap; }
  select, input { font-size: 11px; padding: 3px 6px; border-radius: 4px; border: none; background: #2e3650; color: #fff; }
  label { font-size: 11px; color: #aaa; }
  #legend { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .leg-item { display: flex; align-items: center; gap: 4px; font-size: 10px; }
  .leg-box { width: 12px; height: 12px; border-radius: 2px; }
  .leg-dot { width: 8px; height: 8px; border-radius: 50%; }
  #stats { font-size: 11px; color: #aaa; margin-left: auto; }

  #container { padding: 8px 16px 32px; }
  .row { display: flex; align-items: center; border-bottom: 1px solid #e8e8e8; background: #fff; margin-bottom: 1px; border-radius: 3px; }
  .row:hover { background: #f0f4ff; }
  .row-label { width: 220px; min-width: 220px; padding: 4px 8px; }
  .row-name { font-weight: 500; font-size: 11px; }
  .row-meta { font-size: 10px; color: #888; margin-top: 1px; }
  .row-canvas-wrap { flex: 1; position: relative; height: 28px; }
  canvas.tl { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: crosshair; }
  .row-right { width: 110px; min-width: 110px; padding: 4px 6px; font-size: 10px; color: #555; }
  .badge { display: inline-block; padding: 1px 5px; border-radius: 3px; font-size: 9px; font-weight: 600; }
  .badge-cimo { background: #fde8d0; color: #b84500; }
  .badge-ctrl { background: #dce9fc; color: #1a4a9e; }

  #tooltip { position: fixed; background: rgba(20,20,30,0.92); color: #fff; font-size: 11px;
             padding: 6px 10px; border-radius: 6px; pointer-events: none; display: none;
             z-index: 200; max-width: 220px; line-height: 1.5; }
</style>
</head>
<body>
<div id="header">
  <h1>Session Timelines</h1>
  <div>
    <label>Class </label>
    <select id="fClass"><option value="">All</option></select>
  </div>
  <div>
    <label>Condition </label>
    <select id="fCond"><option value="">All</option><option>control</option><option>ebm_cimo</option></select>
  </div>
  <div>
    <label>Sort </label>
    <select id="fSort">
      <option value="name">Name</option>
      <option value="class">Class</option>
      <option value="total_min">Total duration</option>
      <option value="ratio_pct">Read ratio %</option>
      <option value="chat_count">Chat count</option>
      <option value="inactive_pct">Inactive %</option>
      <option value="inactive_min">Inactive min</option>
      <option value="active_min">Active duration</option>
    </select>
  </div>
  <div style="display:flex;align-items:center;gap:4px">
    <label>Active min </label>
    <input id="fActiveMin" type="number" placeholder="min" min="0" style="width:46px">
    <span style="color:#aaa">–</span>
    <input id="fActiveMax" type="number" placeholder="max" min="0" style="width:46px">
  </div>
  <div>
    <label>Max x (min) </label>
    <input id="fMax" type="number" value="60" min="5" max="400" style="width:60px">
  </div>
  <div style="display:flex;align-items:center;gap:4px">
    <input type="checkbox" id="fTrim" style="width:14px;height:14px;cursor:pointer">
    <label for="fTrim" style="cursor:pointer">Trim inactive</label>
  </div>
  <div id="legend">
    <div class="leg-item"><div class="leg-box" style="background:#4472C4"></div>Reading</div>
    <div class="leg-item"><div class="leg-box" style="background:#ED7D31"></div>Chat</div>
    <div class="leg-item"><div class="leg-box" style="background:#70AD47"></div>Audio</div>
    <div class="leg-item"><div class="leg-box" style="background:#FF6B6B"></div>Video</div>
    <div class="leg-item"><div class="leg-box" style="background:#7030A0"></div>Infographics</div>
    <div class="leg-item"><div class="leg-box" style="background:#aaa;opacity:.5"></div>Inactive</div>
    <div class="leg-item"><div class="leg-dot" style="background:#1a6e1a"></div>Play</div>
    <div class="leg-item"><div class="leg-dot" style="background:#b85c00"></div>Pause</div>
    <div class="leg-item"><div class="leg-dot" style="background:#111"></div>Chat sent</div>
  </div>
  <div id="stats"></div>
</div>

<div id="container"></div>
<div id="tooltip"></div>

<script>
const TAB_COLORS = {
  reading:'#4472C4', chat:'#ED7D31', audio:'#70AD47',
  video:'#FF6B6B', infographics:'#7030A0'
};
const EVT_COLORS = {
  audio_play:'#1a6e1a', audio_pause:'#b85c00', llm_question_asked:'#111111'
};
const EVT_LABELS = {
  audio_play:'▶ Audio play', audio_pause:'⏸ Audio pause', llm_question_asked:'💬 Chat sent'
};

let DATA = [];
const tooltip = document.getElementById('tooltip');

fetch('timeline_data.json').then(r=>r.json()).then(data => {
  DATA = data;

  // populate class filter
  const classes = [...new Set(data.map(d=>d.class))].sort();
  const sel = document.getElementById('fClass');
  classes.forEach(c => { const o=document.createElement('option'); o.value=c; o.text=c; sel.appendChild(o); });

  ['fClass','fCond','fSort','fMax','fActiveMin','fActiveMax'].forEach(id =>
    document.getElementById(id).addEventListener('change', render));
  document.getElementById('fTrim').addEventListener('change', render);

  render();
});

function render() {
  const filterClass = document.getElementById('fClass').value;
  const filterCond  = document.getElementById('fCond').value;
  const sortKey     = document.getElementById('fSort').value;
  const maxMin      = parseFloat(document.getElementById('fMax').value) || 60;
  const trimInactive  = document.getElementById('fTrim').checked;
  const activeMinVal  = parseFloat(document.getElementById('fActiveMin').value);
  const activeMaxVal  = parseFloat(document.getElementById('fActiveMax').value);

  let rows = DATA.filter(d =>
    (!filterClass || d.class === filterClass) &&
    (!filterCond  || d.condition === filterCond) &&
    (isNaN(activeMinVal) || d.active_min >= activeMinVal) &&
    (isNaN(activeMaxVal) || d.active_min <= activeMaxVal)
  );

  rows.sort((a,b) => {
    if (sortKey === 'name') return a.name.localeCompare(b.name);
    if (sortKey === 'class') return a.class.localeCompare(b.class) || a.name.localeCompare(b.name);
    return (b[sortKey]||0) - (a[sortKey]||0);
  });

  document.getElementById('stats').textContent = `${rows.length} participants`;

  const container = document.getElementById('container');
  container.innerHTML = '';

  rows.forEach(d => {
    const row = document.createElement('div');
    row.className = 'row';

    // label
    const lbl = document.createElement('div');
    lbl.className = 'row-label';
    const badge = d.condition === 'ebm_cimo'
      ? '<span class="badge badge-cimo">CIMO</span>'
      : '<span class="badge badge-ctrl">CTRL</span>';
    const inactiveStr = d.inactive_min > 0
      ? ` · <span style="color:#c00">inactive ${d.inactive_min}m (${d.inactive_pct}%)</span>` : '';
    lbl.innerHTML = `<div class="row-name">${d.name} ${badge}</div>
      <div class="row-meta">${d.class} · total ${d.total_min}m · active ${d.active_min}m · read ${d.ratio_pct}%${inactiveStr}</div>`;

    // canvas
    const wrap = document.createElement('div');
    wrap.className = 'row-canvas-wrap';
    const cvs = document.createElement('canvas');
    cvs.className = 'tl';
    wrap.appendChild(cvs);

    // right stats
    const right = document.createElement('div');
    right.className = 'row-right';
    right.innerHTML = `chat: ${d.chat_count}<br>OC: ${d.se_oc??'—'} CE: ${d.se_ce??'—'}<br>AP: ${d.se_ap??'—'}`;

    row.appendChild(lbl);
    row.appendChild(wrap);
    row.appendChild(right);
    container.appendChild(row);

    // draw after layout
    requestAnimationFrame(() => drawTimeline(cvs, d, maxMin, trimInactive));

    // tooltip on mousemove
    cvs.addEventListener('mousemove', e => {
      const rect = cvs.getBoundingClientRect();
      const xRatio = (e.clientX - rect.left) / rect.width;
      const toT = buildTimeMap(d, maxMin, rect.width, trimInactive).toT;
      const tMin = toT(xRatio * rect.width);
      showTooltip(e, d, tMin);
    });
    cvs.addEventListener('mouseleave', () => { tooltip.style.display='none'; });
  });
}

// inactive 구간을 압축한 시간 ↔ x 변환 맵 반환
// 반환: { toX(t)→x, toT(x)→t, segments }
function buildTimeMap(d, maxMin, W, trim) {
  const INACTIVE_PX = 6; // inactive 구간을 표시할 픽셀 너비

  if (!trim || !d.inactive_bands || d.inactive_bands.length === 0) {
    return {
      toX: t => Math.min(t / maxMin * W, W),
      toT: x => x / W * maxMin,
      segments: []
    };
  }

  // active / inactive 세그먼트 구성 (maxMin까지만)
  const segs = [];
  let cur = 0;
  for (const ib of d.inactive_bands) {
    const s = Math.min(ib.s, maxMin), e = Math.min(ib.e, maxMin);
    if (s > cur) segs.push({s: cur, e: s, active: true});
    if (e > s)   segs.push({s, e, active: false});
    cur = e;
    if (cur >= maxMin) break;
  }
  if (cur < maxMin) segs.push({s: cur, e: maxMin, active: true});

  // non-trim과 동일한 스케일 유지: active 구간은 절대 길이, inactive만 압축
  const pxPerMin = W / maxMin;

  // 각 세그먼트에 x 범위 할당
  let xCur = 0;
  for (const seg of segs) {
    seg.xS = xCur;
    seg.xE = xCur + (seg.active
      ? (seg.e - seg.s) * pxPerMin
      : INACTIVE_PX);
    xCur = seg.xE;
  }

  const toX = t => {
    if (t <= 0) return 0;
    if (t >= maxMin) return W;
    for (const seg of segs) {
      if (t >= seg.s && t <= seg.e) {
        const f = (t - seg.s) / (seg.e - seg.s);
        return seg.xS + f * (seg.xE - seg.xS);
      }
    }
    return W;
  };
  const toT = x => {
    for (const seg of segs) {
      if (x >= seg.xS && x <= seg.xE) {
        const f = (x - seg.xS) / (seg.xE - seg.xS);
        return seg.s + f * (seg.e - seg.s);
      }
    }
    return maxMin;
  };
  return {toX, toT, segments: segs};
}

function drawTimeline(cvs, d, maxMin, trimInactive) {
  const W = cvs.offsetWidth;
  const H = cvs.offsetHeight;
  if (!W || !H) return;
  cvs.width  = W * devicePixelRatio;
  cvs.height = H * devicePixelRatio;
  const ctx = cvs.getContext('2d');
  ctx.scale(devicePixelRatio, devicePixelRatio);

  const {toX, segments} = buildTimeMap(d, maxMin, W, trimInactive);
  const midY = H / 2;
  const barH = H * 0.5;

  // background
  ctx.fillStyle = '#f8f8f8';
  ctx.fillRect(0, 0, W, H);

  // gridlines every 10 min (trim 모드에서는 비활성)
  if (!trimInactive) {
    ctx.strokeStyle = '#ddd'; ctx.lineWidth = 0.5;
    for (let t=10; t<maxMin; t+=10) {
      const x = toX(t);
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
    }
  }

  // focus bands
  d.focus_bands.forEach(b => {
    ctx.fillStyle = TAB_COLORS[b.t] || '#ccc';
    ctx.globalAlpha = 0.85;
    ctx.fillRect(toX(b.s), midY-barH/2, toX(b.e)-toX(b.s), barH);
  });
  ctx.globalAlpha = 1;

  // inactive 구간: trim 모드면 얇은 세로 줄, 아니면 회색 overlay
  if (trimInactive) {
    // trim 모드: 압축된 inactive 세그먼트를 사선 패턴으로 표시
    segments.filter(s => !s.active).forEach(seg => {
      const x = seg.xS, w = seg.xE - seg.xS;
      ctx.fillStyle = '#bbb';
      ctx.globalAlpha = 0.9;
      ctx.fillRect(x, 0, w, H);
      // 사선
      ctx.strokeStyle = '#888'; ctx.lineWidth = 0.5; ctx.globalAlpha = 0.6;
      for (let i = -H; i < w + H; i += 3) {
        ctx.beginPath(); ctx.moveTo(x+i, 0); ctx.lineTo(x+i+H, H); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    });
  } else {
    d.inactive_bands.forEach(b => {
      ctx.fillStyle = '#888';
      ctx.globalAlpha = 0.4;
      ctx.fillRect(toX(b.s), midY-barH/2-2, toX(b.e)-toX(b.s), barH+4);
    });
    ctx.globalAlpha = 1;
  }

  // event dots
  const dotR = 3;
  const yOffsets = { audio_play: -barH/2-5, audio_pause: barH/2+5, llm_question_asked: 0 };
  d.events.forEach(ev => {
    const x = toX(ev.t);
    const y = midY + (yOffsets[ev.type]||0);
    ctx.beginPath();
    ctx.arc(x, y, dotR, 0, Math.PI*2);
    ctx.fillStyle = EVT_COLORS[ev.type]||'#999';
    ctx.fill();
  });

  // end marker
  const ex = toX(d.total_min);
  if (ex < W) {
    ctx.strokeStyle = '#333'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(ex, midY-barH/2-3); ctx.lineTo(ex, midY+barH/2+3); ctx.stroke();
  }
}

function showTooltip(e, d, tMin) {
  // find nearest event within 1 min
  const near = d.events
    .map(ev => ({...ev, dist: Math.abs(ev.t - tMin)}))
    .filter(ev => ev.dist < 1)
    .sort((a,b) => a.dist-b.dist)[0];

  // find current tab
  const band = [...d.focus_bands].reverse().find(b => b.s <= tMin);
  const isInactive = d.inactive_bands.some(b => b.s <= tMin && b.e >= tMin);

  let html = `<b>${d.name}</b><br>t = ${tMin.toFixed(1)} min<br>`;
  html += `Tab: <b>${band ? band.t : '—'}</b>`;
  if (isInactive) html += ' <span style="color:#ff9">⚠ browser inactive</span>';
  if (near) html += `<br>Event: <b>${EVT_LABELS[near.type]||near.type}</b> @ ${near.t.toFixed(1)}m`;

  tooltip.innerHTML = html;
  tooltip.style.display = 'block';
  tooltip.style.left = (e.clientX + 12) + 'px';
  tooltip.style.top  = (e.clientY - 10) + 'px';
}
</script>
</body>
</html>
